global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: staging

rule_files:
  - /etc/prometheus/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: exchange-backend
    metrics_path: /internal/metrics
    static_configs:
      - targets: [backend:5000]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
