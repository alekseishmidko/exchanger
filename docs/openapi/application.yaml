openapi: 3.0.3
info:
  title: Exchange Application HTTP API
  version: 1.0.0
  description: Реестр всех HTTP operations, используемый для проверки Swagger drift.
paths:
  /health:
    get:
      operationId: getLiveness
      responses:
        '200': { description: Process is alive }
  /health/live:
    get:
      operationId: getLivenessAlias
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      operationId: getReadiness
      responses:
        '200': { description: Critical dependencies are ready }
        '503': { description: Critical dependency is unavailable }
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Safe user profile and capabilities }
        '401': { description: 'Invalid, expired or revoked session' }
  /api/v1/auth/register:
    post:
      operationId: registerUser
      responses: { '201': { description: User and server session created } }
  /api/v1/auth/login:
    post:
      operationId: loginUser
      responses: { '200': { description: Server session created } }
  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      security: [{ SessionCookie: [] }]
      responses: { '204': { description: Current session revoked } }
  /api/v1/auth/logout-all:
    post:
      operationId: logoutAllUserSessions
      security: [{ SessionCookie: [] }]
      responses: { '200': { description: All sessions revoked } }
  /api/v1/users/me:
    patch:
      operationId: updateOwnProfile
      security: [{ SessionCookie: [] }]
      responses: { '200': { description: Safe updated profile } }
  /api/v1/users/me/password:
    post:
      operationId: changeOwnPassword
      security: [{ SessionCookie: [] }]
      responses: { '201': { description: Password changed and session rotated } }
  /api/v1/users/me/sessions:
    get:
      operationId: listOwnSessions
      security: [{ SessionCookie: [] }]
      responses: { '200': { description: Session metadata without credentials } }
  /api/v1/users/me/sessions/{sessionId}:
    delete:
      operationId: revokeOwnSession
      security: [{ SessionCookie: [] }]
      responses: { '204': { description: Session revoked } }
  /api/v1/auth/email-verification/request:
    post:
      operationId: requestEmailVerification
      responses: { '202': { description: Request accepted without email disclosure } }
  /api/v1/auth/email-verification/confirm:
    post:
      operationId: confirmEmailVerification
      responses: { '204': { description: Email verified } }
  /api/v1/auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      responses: { '202': { description: Request accepted without email disclosure } }
  /api/v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      responses: { '204': { description: Password reset and sessions revoked } }
  /api/v1/admin/users/{userId}/sessions:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    get:
      operationId: adminListUserSessions
      security: [{ SessionCookie: [] }]
      responses: { '200': { description: Safe session metadata } }
  /api/v1/admin/users/{userId}/sessions/{sessionId}:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
      - { name: sessionId, in: path, required: true, schema: { type: string } }
    delete:
      operationId: adminRevokeUserSession
      security: [{ SessionCookie: [] }]
      responses: { '204': { description: Session revoked } }
  /api/v1/admin/users/{userId}/sessions/revoke-all:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      operationId: adminRevokeAllUserSessions
      security: [{ SessionCookie: [] }]
      responses: { '201': { description: Sessions revoked } }
  /api/v1/admin/users/{userId}/require-password-reset:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      operationId: adminRequirePasswordReset
      security: [{ SessionCookie: [] }]
      responses: { '204': { description: Password reset required } }
  /api/v1/machine-auth/me:
    get:
      operationId: getCurrentMachinePrincipal
      security: [{ ApiKeyAuth: [] }]
      responses: { '200': { description: Authenticated machine principal } }
  /api/v1/machine-auth/api-keys:
    get:
      operationId: listApiKeys
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200': { description: API key metadata without secrets }
    post:
      operationId: issueApiKey
      security: [{ ApiKeyAuth: [] }]
      responses:
        '201': { description: API key issued; secret returned once }
  /api/v1/machine-auth/api-keys/{keyId}/rotate:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      operationId: rotateApiKey
      security: [{ ApiKeyAuth: [] }]
      responses:
        '201': { description: API key rotated; new secret returned once }
  /api/v1/machine-auth/api-keys/{keyId}/revoke:
    parameters:
      - $ref: '#/components/parameters/KeyId'
    post:
      operationId: revokeApiKey
      security: [{ ApiKeyAuth: [] }]
      responses:
        '201': { description: API key revoked }
  /api/v1/orders:
    get:
      operationId: listOrders
      responses:
        '200': { description: Order page }
    post:
      operationId: placeOrder
      responses:
        '201': { description: Order command accepted }
  /api/v1/orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getOrder
      responses:
        '200': { description: Order command result }
        '404': { description: Order not found }
  /api/v1/orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    post:
      operationId: cancelOrder
      responses:
        '201': { description: Cancel command accepted }
  /api/v1/projections/orders:
    get:
      operationId: getOrderHistory
      responses:
        '200': { description: User order history }
  /api/v1/projections/trades:
    get:
      operationId: getTradeHistory
      responses:
        '200': { description: User trade history }
  /api/v1/projections/balances:
    get:
      operationId: getBalanceProjection
      responses:
        '200': { description: User balance projections }
  /api/v1/projections/metrics:
    get:
      operationId: getProjectionMetrics
      responses:
        '200': { description: Projection lag metrics }
  /api/v1/instruments:
    get:
      operationId: listInstruments
      responses:
        '200': { description: Instrument catalog }
  /api/v1/instruments/{instrumentId}:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    get:
      operationId: getInstrument
      responses:
        '200': { description: Instrument rules history }
  /api/v1/realtime/instruments:
    get:
      operationId: listRealtimeInstruments
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200': { description: Locally cached Twelve Data instrument catalog }
        '400': { description: Invalid filters or pagination }
  /api/v1/realtime/instruments/{instrumentId}:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    get:
      operationId: getRealtimeInstrument
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200': { description: Realtime instrument metadata }
        '404': { description: Realtime instrument not found }
  /api/v1/realtime/market-status:
    get:
      operationId: getRealtimeMarketStatus
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200': { description: Bounded provider and ingest status }
  /api/v1/realtime/quotes:
    get:
      operationId: listRealtimeQuotes
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - {
            name: instrumentIds,
            in: query,
            required: true,
            schema: { type: string, maxLength: 12900 },
          }
      responses:
        '200': { description: 'Fresh, stale or unavailable local quote snapshots' }
        '400': { description: Invalid or oversized instrument set }
  /api/v1/realtime/orders:
    post:
      operationId: executeRealtimeOrder
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
      responses:
        '200': { description: Reference-price execution filled }
        '400': { description: Invalid or non-tradable operation }
        '409': { description: 'Quote changed, stale or execution paused' }
        '503': { description: Price or liquidity unavailable }
    get:
      operationId: listRealtimeOrders
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200': { description: Principal-owned realtime execution history }
  /api/v1/realtime/orders/{orderId}:
    parameters:
      - {
          name: orderId,
          in: path,
          required: true,
          schema: { type: string, minLength: 1, maxLength: 128 },
        }
    get:
      operationId: getRealtimeOrder
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200': { description: Principal-owned realtime execution }
        '404': { description: Order not found }
  /api/v1/admin/realtime/catalog-sync:
    post:
      operationId: triggerRealtimeCatalogSync
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
      responses:
        '202': { description: Catalog sync accepted }
        '400': { description: Invalid idempotency key }
  /api/v1/admin/realtime/provider-inspect:
    post:
      operationId: inspectTwelveDataProvider
      security: [{ ApiKeyAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transport]
              properties:
                transport: { type: string, enum: [REST, WEBSOCKET] }
                endpoint:
                  type: string
                  enum:
                    - /quote
                    - /price
                    - /time_series
                    - /eod
                    - /exchange_rate
                    - /cryptocurrencies
                    - /forex_pairs
                    - /stocks
                    - /commodities
                    - /symbol_search
                    - /technical_indicators
                symbol: { type: string, minLength: 1, maxLength: 64 }
                exchange: { type: string, minLength: 1, maxLength: 128 }
                interval:
                  type: string
                  enum: [1min, 5min, 15min, 30min, 45min, 1h, 2h, 4h, 8h, 1day]
                outputsize: { type: integer, minimum: 1, maximum: 100 }
                page: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        '200': { description: Bounded sanitized REST response or WebSocket events from Twelve Data }
        '400': { description: Endpoint or parameters are outside the diagnostic allowlist }
        '401': { description: Invalid or missing API key }
        '403': { description: Admin role required }
        '502': { description: Twelve Data connection or response failed }
  /api/v1/admin/realtime/instruments/{instrumentId}/price-enable:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    post:
      operationId: enableRealtimeInstrumentPrice
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
      responses:
        '201': { description: Realtime price ingest enabled }
        '400': { description: Invalid idempotency key }
        '404': { description: Instrument not found or inactive }
  /api/v1/admin/realtime/instruments/{instrumentId}/price-disable:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    post:
      operationId: disableRealtimeInstrumentPrice
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
      responses:
        '201': { description: Realtime price ingest disabled }
        '400': { description: Invalid idempotency key }
        '404': { description: Instrument not found }
  /api/v1/admin/realtime/instruments/{instrumentId}/trading-enable:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    post:
      operationId: enableRealtimeInstrumentTrading
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
      responses:
        '201': { description: Reference-price execution enabled for instrument }
        '404': { description: 'Instrument not found, inactive or price-disabled' }
  /api/v1/admin/realtime/instruments/{instrumentId}/trading-disable:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    post:
      operationId: disableRealtimeInstrumentTrading
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
      responses:
        '201': { description: Reference-price execution disabled for instrument }
  /api/v1/admin/realtime/execution/pause:
    post:
      operationId: pauseRealtimeExecution
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
      responses:
        '201': { description: Execution kill switch enabled }
  /api/v1/admin/realtime/execution/resume:
    post:
      operationId: resumeRealtimeExecution
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - {
            name: Idempotency-Key,
            in: header,
            required: true,
            schema: { type: string, maxLength: 128 },
          }
      responses:
        '201': { description: Execution kill switch disabled }
  /api/v1/admin/realtime/execution/reconciliation:
    get:
      operationId: reconcileRealtimeExecution
      security: [{ ApiKeyAuth: [] }]
      responses:
        '200': { description: 'Commands, quote snapshots, executions and pending outbox counts' }
  /api/v1/accounts:
    post:
      operationId: createAccount
      responses:
        '201': { description: Account created }
  /api/v1/accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getAccount
      responses:
        '200': { description: Account metadata }
  /api/v1/accounts/{accountId}/balances:
    parameters:
      - $ref: '#/components/parameters/AccountId'
    get:
      operationId: getBalances
      responses:
        '200': { description: Account balances }
  /api/v1/accounts/{accountId}/balances/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/AssetId'
    get:
      operationId: getBalance
      responses:
        '200': { description: Asset balance }
  /api/v1/accounts/{accountId}/balances/{assetId}/commands:
    parameters:
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/AssetId'
    post:
      operationId: changeBalance
      responses:
        '201': { description: Balance command applied }
  /api/v1/admin/instruments:
    post:
      operationId: configureInstrument
      responses:
        '201': { description: Instrument configuration requested }
  /api/v1/admin/instruments/{instrumentId}/status:
    parameters:
      - $ref: '#/components/parameters/InstrumentId'
    post:
      operationId: changeInstrumentStatus
      responses:
        '201': { description: Instrument lifecycle change requested }
  /api/v1/admin/freezes:
    post:
      operationId: changeFreeze
      responses:
        '201': { description: Freeze state changed }
  /api/v1/admin/circuit-breakers:
    post:
      operationId: changeCircuitBreaker
      responses:
        '201': { description: Circuit breaker change requested }
  /api/v1/admin/fee-policies:
    post:
      operationId: changeFeePolicy
      responses:
        '201': { description: Fee policy requested }
  /api/v1/admin/risk-policies:
    post:
      operationId: changeRiskPolicy
      responses:
        '201': { description: Risk policy requested }
  /api/v1/admin/approvals/{commandId}:
    parameters:
      - $ref: '#/components/parameters/CommandId'
    post:
      operationId: approveAdministrativeCommand
      responses:
        '201': { description: Administrative command approved }
  /api/v1/admin/reconciliation:
    get:
      operationId: getReconciliation
      responses:
        '200': { description: Reconciliation status }
  /api/v1/admin/audit-events:
    get:
      operationId: getAuditEvents
      security: [{ ApiKeyAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { description: Paginated tamper-evident audit records }
        '400': { description: Invalid pagination }
        '401': { description: Invalid or missing API key }
        '403': { description: Admin or auditor role required }
components:
  securitySchemes:
    ApiKeyAuth: { type: apiKey, in: header, name: x-api-key }
    SessionCookie: { type: apiKey, in: cookie, name: __Host-exchange_session }
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    InstrumentId:
      name: instrumentId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    AccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    CommandId:
      name: commandId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    KeyId:
      name: keyId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
