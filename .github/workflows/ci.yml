name: CI

permissions:
  contents: read
  id-token: write

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d exchange"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/exchange
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository security checks
        run: pnpm security:check

      - name: CI workflow contract checks
        run: pnpm ci:check

      - name: Production dependency audit
        run: pnpm security:audit:prod

      - name: Full dependency audit
        run: pnpm security:audit:all

      - name: Secret scanning
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TypeScript SAST
        run: pipx run semgrep scan --config p/typescript --error apps/backend/src apps/frontend/src

      - name: IaC and filesystem vulnerability scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Maintainability baseline guard
        env:
          MAINTAINABILITY_ENFORCE: 'true'
        run: pnpm maintainability:report

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: API contract validation and drift checks
        run: pnpm contracts:check

      - name: Adversarial input and abuse checks
        run: pnpm adversarial:check

      - name: Observability configuration and telemetry contracts
        run: pnpm observability:check

      - name: Load suite contract
        run: pnpm load:check

      - name: Chaos suite contract and deterministic invariants
        run: pnpm chaos:check && pnpm chaos:component

      - name: Production-readiness documentation contract
        run: pnpm readiness:check

      - name: PostgreSQL repositories, migrations and crash-point transactions
        run: pnpm --filter @exchange/backend test -- src/modules/ledger/infrastructure/postgres.int-spec.ts src/modules/gateway/infrastructure/postgres-api-key.registry.int-spec.ts --runInBand

      - name: Install Redis integration test binary
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends redis-server

      - name: Redis session and distributed abuse integration
        run: pnpm redis:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Inspect production artifact
        run: pnpm security:artifact

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image for vulnerability scan
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          load: true
          tags: exchange-backend:ci
          provenance: false
          sbom: false

      - name: Scan production image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: exchange-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.17.2
        with:
          path: .
          artifact-name: exchange-sbom.spdx.json
          output-file: exchange-sbom.spdx.json

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.9.2

      - name: Sign SBOM with CI workload identity
        run: cosign sign-blob --yes --bundle exchange-sbom.sigstore.json exchange-sbom.spdx.json

      - name: Verify SBOM signature policy
        run: cosign verify-blob --bundle exchange-sbom.sigstore.json --certificate-identity-regexp='^https://github.com/.+/.github/workflows/ci.yml@refs/(heads|pull)/' --certificate-oidc-issuer=https://token.actions.githubusercontent.com exchange-sbom.spdx.json

  api-flows:
    name: Development API flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run black-box API flows
        run: pnpm api:flows

      - name: Publish pipeline summary
        if: always()
        run: cat artifacts/api-flows/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API flow reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-api-flow-reports
          path: artifacts/api-flows/
          if-no-files-found: warn

  load-quick:
    name: k6 ${{ matrix.profile }} profile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [smoke, average]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run isolated k6 profile
        env:
          LOAD_DURATION: 15s
          LOAD_ENVIRONMENT: github-actions-quick
        run: node scripts/run-load-test.mjs ${{ matrix.profile }}

      - name: Publish load summary
        if: always()
        run: find artifacts/load -name summary.md -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"

      - name: Upload load artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ matrix.profile }}-${{ github.sha }}
          path: artifacts/load/
          if-no-files-found: warn

      - name: Show backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.development.yml -f docker-compose.observability.yml -f docker-compose.load.yml logs backend

      - name: Stop load environment
        if: always()
        run: docker compose -f docker-compose.development.yml -f docker-compose.observability.yml -f docker-compose.load.yml down --volumes
