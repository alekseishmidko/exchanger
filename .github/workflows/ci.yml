name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exchange
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d exchange"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/exchange
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repository security checks
        run: pnpm security:check

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: API contract validation and drift checks
        run: pnpm contracts:check

      - name: Observability configuration and telemetry contracts
        run: pnpm observability:check

      - name: Load suite contract
        run: pnpm load:check

      - name: Tests
        run: pnpm test

      - name: Build
        run: pnpm build

  api-flows:
    name: Development API flows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start development environment
        run: docker compose -f docker-compose.development.yml up -d --build

      - name: Run black-box API flows
        run: pnpm api:flows

      - name: Publish pipeline summary
        if: always()
        run: cat artifacts/api-flows/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload API flow reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-api-flow-reports
          path: artifacts/api-flows/
          if-no-files-found: warn

      - name: Show backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.development.yml logs backend

      - name: Stop development environment
        if: always()
        run: docker compose -f docker-compose.development.yml down --volumes

  load-quick:
    name: k6 ${{ matrix.profile }} profile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [smoke, average]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run isolated k6 profile
        env:
          LOAD_DURATION: 15s
          LOAD_ENVIRONMENT: github-actions-quick
        run: node scripts/run-load-test.mjs ${{ matrix.profile }}

      - name: Publish load summary
        if: always()
        run: find artifacts/load -name summary.md -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"

      - name: Upload load artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-${{ matrix.profile }}-${{ github.sha }}
          path: artifacts/load/
          if-no-files-found: warn

      - name: Show backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.development.yml -f docker-compose.observability.yml -f docker-compose.load.yml logs backend

      - name: Stop load environment
        if: always()
        run: docker compose -f docker-compose.development.yml -f docker-compose.observability.yml -f docker-compose.load.yml down --volumes
